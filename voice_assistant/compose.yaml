services:
  db:
    image: pgvector/pgvector:pg18-trixie
    container_name: friday-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: friday
      POSTGRES_USER: friday_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set this in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - friday_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U friday_admin -d friday"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  friday_pgdata: